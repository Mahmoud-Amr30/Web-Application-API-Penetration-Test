name: Research
description: Record a research topic, its findings, and open questions.
title: "[RESEARCH]: "
labels: ["type:research"]
body:
  - type: input
    id: topic
    attributes:
      label: Topic
      description: Short subject, e.g. "DVWA API lab prerequisites" or "CVSS scoring basics".
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Research question
      description: The specific question this research should answer.
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Why the team needs this answer and what it will be used for.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Official documentation, course material, or references consulted. Include links.
    validations:
      required: false
  - type: textarea
    id: conclusions
    attributes:
      label: Conclusions
      description: Fill in after research is complete. Note anything that could not be answered.
    validations:
      required: false
  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: Anything still unanswered or needing team/instructor input.
    validations:
      required: false
